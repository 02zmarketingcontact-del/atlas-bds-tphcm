(function(){

  const q=new URLSearchParams(location.search);
  let destination;
  if(q.get("legacy")==="1"){
    q.delete("legacy");
    destination="./legacy.html"+(q.toString()?"?"+q.toString():"")+location.hash;
  }else if(q.has("p")||(q.has("lat")&&q.has("lng"))){
    destination="./map-v4.html"+location.search+location.hash;
  }else{
    destination="./review.html"+location.search+location.hash;
  }
  location.replace(destination);
})();
</script>
