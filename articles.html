<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,follow"><title>QiMap | Bài phân tích đa ngôn ngữ</title><style>body{font:16px/1.7 system-ui;background:#f6f3ec;color:#223139;margin:0}header{background:#223139;color:white;padding:24px 5%}main{max-width:880px;margin:auto;padding:24px}article{background:white;padding:24px;border-radius:12px;margin:16px 0}button{padding:9px 12px;margin:3px;border:1px solid #b49a7d;background:white;border-radius:8px}a{color:#8b6444}p{white-space:pre-line}</style></head><body><header><h1>QiMap | Market Intelligence</h1><a href="news.html" style="color:white">← News</a></header><main><nav><button onclick="setlang('vi')">Tiếng Việt</button><button onclick="setlang('en')">English</button><button onclick="setlang('zh-CN')">简体中文</button><button onclick="setlang('zh-TW')">繁體中文</button></nav><div id="status">Đang tải bài viết...</div><div id="articles"></div></main><script>let lang='vi',index=[];function setlang(x){lang=x;render()}async function render(){let box=document.getElementById('articles');box.replaceChildren();document.documentElement.lang=lang;for(const item of index.slice(-20).reverse()){try{let res=await fetch('data/news/articles/'+encodeURIComponent(item.id)+'.json');if(!res.ok)continue;let data=await res.json();let t=data.languages&&data.languages[lang];if(!t||!t.body)continue;let a=document.createElement('article'),h=document.createElement('h2'),p=document.createElement('p'),s=document.createElement('small'),link=document.createElement('a');h.textContent=t.title;p.textContent=t.body;s.textContent=data.source+' · '+data.published+' · QiMap original commentary based on headline';link.href=data.source_url;link.target='_blank';link.rel='noopener noreferrer';link.textContent='Original source ↗';a.append(s,h,p,link);box.append(a)}catch(e){}}document.getElementById('status').textContent=index.length+' bài hoàn chỉnh (4 ngôn ngữ)'}(async()=>{try{const r=await fetch('data/news/articles-index.json?ts='+Date.now());if(!r.ok)throw Error('pending');index=(await r.json()).items||[];render()}catch(e){document.getElementById('status').textContent='Chưa có bài hoàn chỉnh được xuất bản. Bộ tạo nội dung đang chờ chạy thành công.'}})()</script></body></html>
