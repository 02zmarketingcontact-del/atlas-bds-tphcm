name: ATLAS import bounded OSM transit snapshot into research branch
on:
  push:
    branches:
      - feat/transit-planning-developer-history-20261009
    paths:
      - '.github/workflows/atlas-transit-import.yml'
      - 'scripts/fetch-transit-osm.cjs'
permissions:
  contents: write
  actions: read
jobs:
  snapshot:
    if: github.repository == '02zmarketingcontact-del/atlas-bds-tphcm'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/transit-planning-developer-history-20261009
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Reuse successfully captured OSM artifact (avoid repeat rate-limited queries)
        uses: actions/download-artifact@v4
        with:
          name: atlas-transit-candidates
          path: artifacts/
          run-id: 37901242808
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Require candidate data and preserve source metadata
        run: |
          node -e "const fs=require('fs');const a=JSON.parse(fs.readFileSync('artifacts/metro_stations_osm.geojson')),b=JSON.parse(fs.readFileSync('artifacts/bus_stops_osm.geojson'));if(a.features.length<8||b.features.length<50)process.exit(1);console.log('Candidates',a.features.length,b.features.length);"
          cp artifacts/metro_stations_osm.geojson data/metro_stations_osm.geojson
          cp artifacts/bus_stops_osm.geojson data/bus_stops_osm.geojson
      - name: Commit ODbL-attributed snapshot to research branch, never directly to main
        run: |
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add data/metro_stations_osm.geojson data/bus_stops_osm.geojson
          if git diff --cached --quiet; then echo "No candidate changes"; exit 0; fi
          git commit -m "data(osm): import attributed public transit candidates for review"
          git push origin HEAD:feat/transit-planning-developer-history-20261009
