name: QILUVI Data Trust Audit
on:
  pull_request:
    paths:
      - 'data/projects.json'
      - 'data/project_search_index.json'
      - 'data/price_history.json'
      - 'data/update_status.json'
      - 'scripts/audit-qiluvi-data.cjs'
      - '.github/workflows/qiluvi-data-trust.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Script syntax
        run: node --check scripts/audit-qiluvi-data.cjs
      - name: Audit legacy data (read only)
        run: node scripts/audit-qiluvi-data.cjs --check --json | tee qiluvi-data-audit.json
      - name: Archive audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qiluvi-data-audit
          path: qiluvi-data-audit.json
          if-no-files-found: ignore
