name: Atlas data integrity and static validation
on:
  push:
    branches: [main, feat/atlas-v4-map-data-foundation]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '17 2 * * *'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify JSON, provenance and GIS schemas
        run: node scripts/validate-data.cjs
      - name: Validate 105 QiMap GIS references and provenance
        run: node scripts/validate-qimap-gis-reference.cjs
      - name: Validate remaining 48 GIS review batch
        run: node scripts/validate-qimap-remaining-48.cjs
      - name: Verify browser JavaScript syntax
        run: node --check assets/atlas-v4.js
      - name: ATLAS V1 release smoke checks
        run: node scripts/validate-v1.cjs
      - name: QiMap and QILUVI brand identity contract
        run: node scripts/validate-qimap-brand.cjs
      - name: Verify 126 historic entries merge into one sourced QiMap index
        run: node scripts/build-project-index.cjs --check
