name: QiMap Fast News
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/qimap-source-resolver.py'
  schedule:
    - cron: '13 * * * *'
permissions:
  contents: write
concurrency:
  group: qimap-fast-news
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Gather public news metadata
        run: python scripts/qimap-fast-news.py
      - name: Resolve original publisher sources
        run: python scripts/qimap-source-resolver.py
      - name: Translate fresh news metadata
        env:
          GH_TOKEN: ${{ github.token }}
          TRANSLATE_ITEMS: '12'
        continue-on-error: true
        run: python scripts/qimap-translate-news.py
      - name: Create original four-language articles
        env:
          GH_TOKEN: ${{ github.token }}
          ARTICLE_LIMIT: '40'
        continue-on-error: true
        run: python scripts/qimap-full-articles.py
      - name: Enforce multilingual publication gate
        run: python scripts/qimap-publish-gate.py
      - name: Commit news dataset if changed
        run: |
          git config user.name "qimap-news-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/news/latest.json data/news/archive/ data/news/articles/ data/news/articles-index.json
          if ! git diff --cached --quiet; then
            git commit -m "data(news): refresh public news briefs [skip ci]"
            git push
          fi
