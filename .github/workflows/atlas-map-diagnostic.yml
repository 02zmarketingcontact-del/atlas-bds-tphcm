name: ATLAS map diagnostic
on:
  pull_request:
    paths:
      - 'scripts/diagnose-map.cjs'
      - '.github/workflows/atlas-map-diagnostic.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Chromium
        run: |
          npm install --no-save playwright@1.56.0
          npx playwright install --with-deps chromium
      - name: Diagnose basemap sources on published site
        run: node scripts/diagnose-map.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: atlas-map-diagnostic
          path: artifacts/
          if-no-files-found: warn
          retention-days: 2
