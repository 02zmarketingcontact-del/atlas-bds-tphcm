<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>QiMap | Tin thị trường</title><style>body{margin:0;background:#f6f3ec;color:#223139;font:16px system-ui}header{background:#223139;color:white;padding:28px 5%}main{max-width:900px;margin:auto;padding:24px}article{background:white;padding:22px;border-radius:12px;margin:16px 0;border:1px solid #ddd}a{color:#8b6444}small{color:#666}button{padding:10px;margin:3px;border:1px solid #b49a7d;background:white;border-radius:7px}</style></head><body><header><h1>QiMap · Market Intelligence</h1><p>QILUVI | Vietnam Apartment Research</p></header><main><p>Thông tin nghiên cứu độc lập; nguồn gốc được liên kết để kiểm tra. Không xem giá tham khảo là giá giao dịch xác minh.</p><div><button onclick="show('vi')">Tiếng Việt</button><button onclick="show('en')">English</button><button onclick="show('zh')">简体中文</button><button onclick="show('tw')">繁體中文</button></div><div id="articles"></div><section id="live" style="margin-top:24px"><h2>Tin mới từ nguồn công khai</h2><p id="newsstatus">Đang tải bản tin...</p><div id="liveitems"></div></section><script>(async function(){const status=document.getElementById('newsstatus'),box=document.getElementById('liveitems');window.qimapRefreshNews=function(){box.replaceChildren();const data=window.qimapNewsData;if(!data)return;const lang=window.qimapLang||'vi';data.items.filter(x=>['en','zh-CN','zh-TW'].every(k=>x.translations&&x.translations[k]&&x.translations[k].title&&x.translations[k].brief)).slice(-60).reverse().forEach(x=>{const a=document.createElement('article'),h=document.createElement('h3'),p=document.createElement('p'),link=document.createElement('a'),meta=document.createElement('small');const key={vi:'vi',en:'en',zh:'zh-CN',tw:'zh-TW'}[lang];const translated=x.translations&&x.translations[key];h.textContent=translated?translated.title:x.title;p.textContent=translated?translated.brief:x.brief;meta.textContent=x.topic+' · '+x.source+' · '+x.published+(lang!=='vi'&&!translated?' · Bản gốc tiếng Việt / Translation pending':'');link.href=x.source_url;link.textContent='Source ↗';link.target='_blank';link.rel='noopener noreferrer';a.append(meta,h,p,link);box.append(a)})};try{const r=await fetch('data/news/latest.json?ts='+Date.now());if(!r.ok)throw Error('not ready');const d=await r.json();status.textContent=d.items.filter(x=>['en','zh-CN','zh-TW'].every(k=>x.translations&&x.translations[k]&&x.translations[k].title&&x.translations[k].brief)).length+' tin hoàn chỉnh (4 ngôn ngữ) · Cập nhật '+new Date(d.updated_at).toLocaleString('vi-VN')+' · Chưa xác minh độc lập';window.qimapNewsData=d;window.qimapRefreshNews();}catch(e){status.textContent='Bộ thu thập tin đang khởi tạo; chưa có dữ liệu mới được xuất bản.'}})()</script></main><script>const news=[{date:'18/10/2026',source:'Bộ Xây dựng',url:'https://moc.gov.vn/',vi:['Theo dõi chính sách phát triển nhà ở Việt Nam','Nguồn chính thức để theo dõi thông báo quy hoạch, pháp luật và thị trường xây dựng. QiMap chưa xác minh nội dung một thông báo cụ thể trong lần cập nhật này.'],en:['Vietnam housing policy monitoring','Official source for construction and housing announcements. No specific announcement has been verified for this update.'],zh:['越南住房政策动态','越南建设部官方网站可用于核查住房与建设政策。本次更新尚未核实具体公告。'],tw:['越南住房政策動態','越南建設部官方網站可供核查住房與建設政策。本次更新尚未核實特定公告。']},{date:'18/10/2026',source:'Savills Vietnam',url:'https://www.savills.com.vn/',vi:['Nguồn nghiên cứu thị trường bất động sản','Báo cáo nghiên cứu của Savills có thể hỗ trợ đối chiếu xu hướng cung, cầu và giá. Cần kiểm tra kỳ báo cáo và phương pháp trước khi áp dụng cho dự án cụ thể.'],en:['Real estate market research source','Savills research can inform supply, demand and pricing trends. Check the reporting period and methodology before applying it to individual projects.'],zh:['房地产市场研究来源','Savills 研究报告可作为供需与价格趋势的参考，具体项目仍需核对报告期间及统计方法。'],tw:['房地產市場研究來源','Savills 研究報告可作為供需與價格趨勢的參考，特定項目仍需核對報告期間及統計方法。']},{date:'18/10/2026',source:'CBRE Vietnam',url:'https://www.cbrevietnam.com/',vi:['Nguồn tham khảo thị trường căn hộ','Các báo cáo thị trường của CBRE giúp xây dựng bối cảnh phân khúc căn hộ; không thể coi giá bình quân là giá giao dịch của một căn cụ thể.'],en:['Apartment market reference','CBRE market research provides apartment-sector context; averages are not verified transaction prices for individual units.'],zh:['公寓市场参考资料','CBRE 市场研究可用于了解公寓市场背景，但平均价格不等于具体房源的核实成交价。'],tw:['公寓市場參考資料','CBRE 市場研究可用於了解公寓市場背景，但平均價格不等於特定物件的核實成交價。']}];function show(l){window.qimapLang=l;if(window.qimapRefreshNews)window.qimapRefreshNews();document.getElementById('articles').innerHTML=news.map(n=>'<article><small>'+n.date+' · '+n.source+'</small><h2>'+n[l][0]+'</h2><p>'+n[l][1]+'</p><a href="'+n.url+'" target="_blank" rel="noopener noreferrer">Source ↗</a></article>').join('')}show('vi')</script></body></html>
